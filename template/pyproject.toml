[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beaupy>=3.10.1",
    "jinja2>=3.1.6",
    "prompt-toolkit>=3.0.51",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools]
packages = []
py-modules = ["config"]

[tool.setuptools.package-dir]
"" = "."
