services:
    # -----------------------------
    # Base wiki Service
    # -----------------------------
    # This must be used as the base for all wiki services

    wikibase:
        build:
            context: .
            dockerfile: docker/mediawiki_with_composer.Dockerfile
            args:
                W4R_MW_VERSION: $W4R_MW_VERSION
                W4R_MW_WIKI_NAME: $W4R_MW_WIKI_NAME
                W4R_MW_ADMIN_USER: $W4R_MW_ADMIN_USER
                W4R_MW_ADMIN_PASS: $W4R_MW_ADMIN_PASS
                W4R_FULL_SERVER_NAME: $W4R_FULL_SERVER_NAME
                W4R_DB_SERVER: $W4R_DB_SERVER
                W4R_DB_NAME: $W4R_DB_NAME
                W4R_DB_USER: $W4R_DB_USER
                W4R_DB_PASS: $W4R_DB_PASS
                W4R_INIT_FOLDER: $W4R_INIT_FOLDER
        restart: unless-stopped
        volumes:
            - $W4R_INIT_FOLDER/config/LocalSettings.php:/var/www/html/LocalSettings.php.tmp
            - $W4R_INIT_FOLDER/config/LocalSettings.d:/var/www/html/LocalSettings.d
            - $W4R_INIT_FOLDER:/var/tmp/wikiPresets
            - ./scripts/wblocal.htaccess:/var/www/html/.htaccess
            - ./scripts:/var/www/html/scripts
            - app-data:/var/www/html
        depends_on:
            database:
                condition: service_healthy
        labels:
            - "traefik.http.routers.wikibase.rule=Host(`${W4R_SERVER_NAME}`)"
        entrypoint: ["/usr/local/bin/entrypoint.sh"]
        user: root
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "${W4R_FULL_SERVER_NAME}/index.php?title=Main_Page",
                ]
            interval: 30s
            retries: $W4R_COMPOSER_HEALTHCHECK_RETRIES
            start_period: 30s
            timeout: 10s
        networks:
            default:
                aliases:
                    - ${W4R_SERVER_NAME}

    database:
        image: mariadb:10.9
        restart: unless-stopped
        environment:
            MARIADB_USER: ${W4R_DB_USER}
            MARIADB_PASSWORD: ${W4R_DB_PASS}
            MARIADB_DATABASE: ${W4R_DB_NAME}
            MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "${W4R_SERVER_NAME}",
                    "-u",
                    "${W4R_DB_USER}",
                    "-p${W4R_DB_PASS}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - db-data:/var/lib/mysql

    # -----------------------------
    # Wikibase Jobrunner
    # -----------------------------

    wikibase_jobrunner:
        build:
            context: .
            dockerfile: docker/mediawiki_with_composer.Dockerfile
            args:
                W4R_MW_VERSION: $W4R_MW_VERSION
                W4R_MW_WIKI_NAME: $W4R_MW_WIKI_NAME
                W4R_MW_ADMIN_USER: $W4R_MW_ADMIN_USER
                W4R_MW_ADMIN_PASS: $W4R_MW_ADMIN_PASS
                W4R_FULL_SERVER_NAME: $W4R_FULL_SERVER_NAME
                W4R_DB_SERVER: $W4R_DB_SERVER
                W4R_DB_NAME: $W4R_DB_NAME
                W4R_DB_USER: $W4R_DB_USER
                W4R_DB_PASS: $W4R_DB_PASS
                W4R_INIT_FOLDER: $W4R_INIT_FOLDER
        command: /jobrunner-entrypoint.sh
        depends_on:
            wikibase:
                condition: service_healthy
        restart: unless-stopped
        volumes_from:
            - wikibase

    # To disable Elasticsearch and use default MediaWiki search functionality remove
    # the elasticsearch service, and the W4R_MW_ELASTIC_* vars from wikibase_variables
    # at the top of this file.
    elasticsearch:
        image: wikibase/elasticsearch:1
        restart: unless-stopped
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        environment:
            discovery.type: single-node
            ES_JAVA_OPTS: -Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true
        healthcheck:
            test: curl --silent --fail localhost:9200
            interval: 10s
            start_period: 2m

    # -----------------------------
    # Wikidata Query Service
    # -----------------------------

    wdqs:
        image: wikibase/wdqs:1
        command: /runBlazegraph.sh
        depends_on:
            wikibase:
                condition: service_healthy
        restart: unless-stopped
        # Set number of files ulimit high enough, otherwise blazegraph will abort with:
        # library initialization failed - unable to allocate file descriptor table - out of memory
        # Appeared on Docker 24.0.5, containerd 1.7.9, Linux 6.6.6, NixOS 23.11
        ulimits:
            nofile:
                soft: 32768
                hard: 32768
        volumes:
            - wdqs-data:/wdqs/data
        healthcheck:
            test: curl --silent --fail localhost:9999/bigdata/namespace/wdq/sparql
            interval: 10s
            start_period: 2m
        labels:
            - "traefik.enable=false"

    wdqs-updater:
        image: wikibase/wdqs:1
        command: /runUpdate.sh -- --start 20240813010000 --init -DwikibaseMaxDaysBack=999
        depends_on:
            wdqs:
                condition: service_healthy
        restart: unless-stopped
        environment:
            WIKIBASE_HOST: $W4R_SERVER_NAME
        # Set number of files ulimit high enough, otherwise blazegraph will abort with:
        # library initialization failed - unable to allocate file descriptor table - out of memory
        # Appeared on Docker 24.0.5, containerd 1.7.9, Linux 6.6.6, NixOS 23.11
        ulimits:
            nofile:
                soft: 32768
                hard: 32768
        labels:
            - "traefik.enable=false"
        user: root

    wdqs-proxy:
        image: wikibase/wdqs-proxy:1
        depends_on:
            wdqs:
                condition: service_healthy
        restart: unless-stopped

    wdqs-frontend:
        image: wikibase/wdqs-frontend:1
        depends_on:
            - wdqs-proxy
        restart: unless-stopped
        labels:
            - "traefik.http.routers.wdqs-frontend.rule=Host(`${W4R_WDQS_FRONTEND_SERVER_NAME}`)"
        environment:
            WDQS_HOST: wdqs-proxy
        healthcheck:
            test: curl --silent --fail localhost
            interval: 10s
            start_period: 2m

    ####################
    # Openrefine       #
    ####################
    openrefine-redis:
        image: "redis:alpine"
        #container_name: openrefine-redis
        expose:
            - "6379"

    openrefine:
        image: registry.gitlab.com/nfdi4culture/openrefine-reconciliation-services/openrefine-wikibase:latest
        volumes:
            - $W4R_INIT_FOLDER/config/openrefine-wikibase-config.py:/openrefine-wikibase/config.py
            - $W4R_INIT_FOLDER/config/openrefine-manifest.json:/openrefine-wikibase/static/manifest.json
        environment:
            W4R_MW_WIKI_NAME: ${W4R_MW_WIKI_NAME}
            W4R_SERVER_NAME: ${W4R_SERVER_NAME}
            W4R_OPENREFINE_SERVER_NAME: ${W4R_OPENREFINE_SERVER_NAME}
        depends_on:
            - openrefine-redis
        labels:
            - "traefik.http.routers.openrefine.rule=Host(`${W4R_OPENREFINE_SERVER_NAME}`)"

    control:
        build:
            context: .
            dockerfile: docker/control.Dockerfile
            args:
                W4R_CUSTOM_INIT_PYTHON_SCRIPT: ${W4R_CUSTOM_INIT_PYTHON_SCRIPT}
                W4R_INIT_FOLDER: ${W4R_INIT_FOLDER}
        depends_on:
            wikibase:
                condition: service_healthy
        environment:
            W4R_MW_ADMIN_USER: ${W4R_MW_ADMIN_USER}
            W4R_MW_ADMIN_PASS: ${W4R_MW_ADMIN_PASS}
            W4R_SERVER_NAME: ${W4R_SERVER_NAME}
        #restart: unless-stopped
        volumes_from:
            - wikibase
        labels:
            - "traefik.enable=false"

    reverse-proxy:
        image: traefik:v3.0
        command: --api.insecure=true --providers.docker
        ports:
            - $W4R_REVERSEPROXY_PORT:80
            - $W4R_TRAEFIK_WEBCONFIG_PORT:8080
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock

volumes:
    app-data:
    db-data:
    wdqs-data:
    elasticsearch-data:
